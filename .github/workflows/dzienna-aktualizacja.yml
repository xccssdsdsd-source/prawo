name: Dzienna aktualizacja danych

# Raz dziennie sprawdza API Sejmu, pobiera tylko nowe/zmienione akty, synchronizuje baze Postgres
# i commituje nowy data-info.json (Vercel wdraza zmiane sam). Zwykly Python, bez AI.
# Wymagany sekret repozytorium: DATABASE_URL (Settings > Secrets and variables > Actions).
# Opcjonalna zmienna (Variables): DB_MAX_MB (domyslnie 450).

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC (okolo 04:17/05:17 czasu polskiego); GitHub moze opoznic start
  workflow_dispatch:
    inputs:
      force_removals:
        description: "Zezwol na wycofanie >3% aktow (tylko po recznym sprawdzeniu przyczyny)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dzienna-aktualizacja
  cancel-in-progress: false

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Zaleznosci
        run: pip install -r pipeline/requirements.txt

      - name: Aktualizacja (dane -> eksport -> baza -> data-info)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_MAX_MB: ${{ vars.DB_MAX_MB }}
          FORCE: ${{ inputs.force_removals }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python pipeline/ci_daily.py --force-removals
          else
            python pipeline/ci_daily.py
          fi

      - name: Zatwierdz zmiany (dopiero po sukcesie wszystkich krokow)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_stan/manifest.json vercel/public/data-info.json vercel/public/index.html vercel/public/podlacz.html
          if git diff --cached --quiet; then
            echo "Brak zmian do zatwierdzenia."
          else
            git commit -m "Dzienna aktualizacja danych: stan na $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
